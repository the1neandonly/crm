<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevelopTheOne — Agency OS</title>
<style>
:root{--brand:#2f6fed;--brand-2:#1b46c2;--brand-dark:#1740b4;--brand-wash:#f0f4fe;--bg:#ffffff;--bg2:#fbfbfc;--surface:#ffffff;--surface2:#f4f4f6;--line:#e7e7ea;--line2:#d5d5da;--txt:#0a0a0b;--muted:#55555f;--muted2:#6f6f79;--good:#0f7b55;--warn:#9a6700;--bad:#c0362c;--purple:#5b4bd6;--gold:#8a6a00;--shadow:0 1px 2px rgba(16,18,24,.06);--r:5px;--r-sm:3px}
html[data-theme="dark"]{--brand:#2f6fed;--brand-2:#7ba4ff;--brand-dark:#1c4fd1;--brand-wash:rgba(47,111,237,.12);--bg:#070b13;--bg2:#0a1020;--surface:#111a2e;--surface2:#16223b;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.17);--txt:#eaf0fb;--muted:#8fa2c4;--muted2:#5f7096;--good:#22c07d;--warn:#f5b940;--bad:#f4685f;--purple:#a78bfa;--gold:#ffcf5c;--shadow:0 24px 60px -30px rgba(0,0,0,.9)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,-apple-system,Roboto,sans-serif;color:var(--txt);overflow:hidden;background:radial-gradient(1200px 600px at 82% -12%,rgba(47,111,237,.16),transparent 60%),var(--bg);transition:background .3s}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--brand),var(--brand-dark));border-radius:9px}::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(47,111,237,.4)}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
[dir="rtl"] .app{grid-template-columns:1fr 250px}
.side{background:linear-gradient(180deg,var(--bg2),var(--bg));border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 6px 12px}
.brand img{max-width:170px;max-height:42px;object-fit:contain}
.me{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.16s}
.me:hover{border-color:var(--brand)}
.me .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.me .mn{font-size:12.5px;font-weight:700}.me .mr{font-size:10.5px;color:var(--muted2)}.me .sw{margin-inline-start:auto;font-size:10px;color:var(--muted2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);padding:12px 12px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;transition:.16s;border:1px solid transparent}
.nav-item:hover{background:var(--surface);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(47,111,237,.24),rgba(47,111,237,.05));color:var(--txt);border-color:rgba(47,111,237,.35)}
.nav-item .ic{width:17px;height:17px;flex-shrink:0}
.nav-item .badge{margin-inline-start:auto;background:var(--surface2);border:1px solid var(--line);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:20px;color:var(--muted)}
.nav-item.active .badge{background:var(--brand);color:#fff;border-color:transparent}.nav-item .badge.red{background:var(--bad);color:#fff;border-color:transparent}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.mini-btn{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.16s}
.mini-btn:hover{color:var(--txt);border-color:var(--line2)}.mini-btn svg{width:14px;height:14px}
.kbd{font-size:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-inline-start:auto;color:var(--muted2)}
.langs{display:flex;gap:5px}
.langs .lg{flex:1;text-align:center;padding:6px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.langs .lg.on{background:var(--brand);color:#fff;border-color:transparent}
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 30px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:21px;font-weight:800}.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.toggle-mine{display:flex;align-items:center;gap:8px;margin-inline-start:auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle-mine.on{background:rgba(47,111,237,.15);border-color:var(--brand);color:var(--txt)}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.iconbtn:hover{border-color:var(--brand)}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--muted);font-size:12.5px;cursor:pointer}
.cmdk:hover{border-color:var(--brand);color:var(--txt)}.cmdk svg{width:15px;height:15px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:none;cursor:pointer;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:700;transition:.16s;box-shadow:0 10px 24px -12px var(--brand)}
.btn:hover{background:var(--brand-dark);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--txt);border:1px solid var(--line);box-shadow:none}.btn.ghost:hover{border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(244,104,95,.3);box-shadow:none;margin-inline-end:auto}.btn.danger:hover{background:rgba(244,104,95,.1)}
.btn svg{width:16px;height:16px}.btn.sm{padding:8px 13px;font-size:12px}
.content{flex:1;overflow-y:auto;padding:22px 30px 60px}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}
.stat{background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:29px;font-weight:800;margin-top:7px}.stat .val small{font-size:14px;color:var(--muted);font-weight:600}
.stat .chg{font-size:11.5px;margin-top:5px;font-weight:600;color:var(--muted)}.stat .chg.up{color:var(--good)}.stat .chg.down{color:var(--bad)}
.stat .ic{position:absolute;inset-inline-end:16px;top:16px;width:32px;height:32px;border-radius:10px;background:rgba(47,111,237,.15);display:flex;align-items:center;justify-content:center;color:var(--brand-2)}.stat .ic svg{width:17px;height:17px}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-bottom:15px}
.panel{background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h3{font-size:14px;font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.panel h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.panel h3 .tag{margin-inline-start:auto;font-size:10.5px;font-weight:700;color:var(--brand-2);background:rgba(47,111,237,.12);padding:2px 9px;border-radius:20px}
.panel h3 .act{margin-inline-start:auto;font-size:11px;color:var(--brand-2);cursor:pointer;font-weight:700}
.nba{display:flex;flex-direction:column;gap:9px}
.nba-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:.16s}
.nba-item:hover{border-color:var(--brand)}
.nba-rank{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;color:#fff}
.nba-txt{font-size:13px;font-weight:600;line-height:1.35}.nba-txt small{display:block;color:var(--muted2);font-weight:500;font-size:11px;margin-top:2px}
.nba-val{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--good);white-space:nowrap}
.funnel{display:flex;flex-direction:column;gap:7px}.fbar{display:flex;align-items:center;gap:12px}.fbar .flabel{font-size:12px;color:var(--muted);width:100px;flex-shrink:0}
.fbar .ftrack{flex:1;height:28px;background:var(--bg);border-radius:8px;overflow:hidden}
.fbar .ffill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),var(--brand-2));display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#fff;min-width:34px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.goal-ring{display:flex;align-items:center;gap:18px}.ring{position:relative;width:96px;height:96px;flex-shrink:0}.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .rt b{font-size:20px;font-weight:800}
.goal-info{flex:1}.goal-info .gi-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--muted)}.goal-info .gi-row b{color:var(--txt)}
.goal-edit{font-size:11px;color:var(--brand-2);cursor:pointer;margin-top:6px;display:inline-block}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.cbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%}
.cbar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:7px 7px 0 0;transition:height .8s;position:relative;margin-top:auto;min-height:3px}
.cbar .cbv{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}.cbar-wrap .cbl{font-size:11px;color:var(--muted2)}
.board{display:flex;gap:15px;align-items:flex-start;overflow-x:auto;padding-bottom:20px;min-height:60vh}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:288px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col-head{display:flex;align-items:center;gap:9px;padding:14px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.col-head .cdot{width:9px;height:9px;border-radius:3px}.col-head .cname{font-weight:700;font-size:13px}
.col-head .ccount{margin-inline-start:auto;background:var(--surface);border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--muted);padding:1px 9px;border-radius:20px}
.col-head .cval{font-size:10.5px;color:var(--muted2);flex-basis:100%}
.col-body{padding:11px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;min-height:60px}
.col-body.dragover{background:rgba(47,111,237,.08);outline:2px dashed rgba(47,111,237,.4);outline-offset:-8px;border-radius:12px}
.card{background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:13px;padding:13px;cursor:grab;transition:.16s;position:relative}
.card:hover{border-color:var(--brand);transform:translateY(-2px)}.card.dragging{opacity:.4}
.card.rot{border-color:rgba(245,185,64,.5)}.card.rot::after{content:"";position:absolute;top:10px;inset-inline-end:10px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.card .ctitle{font-weight:700;font-size:13.5px;margin-bottom:3px}.card .csub{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.card .cmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.money{color:var(--good);border-color:rgba(34,192,125,.3);background:rgba(34,192,125,.08)}
.card .cfoot{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.cardacts{display:flex;gap:7px;margin-top:9px}
.cact{flex:1;text-align:center;padding:8px 6px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;transition:.14s;border:1px solid transparent;letter-spacing:.2px}
.cact.call{background:rgba(47,111,237,.14);color:#5b8cff;border-color:rgba(47,111,237,.3)}
.cact.call:hover{background:var(--brand);color:#fff}
.cact.wa{background:rgba(34,192,125,.14);color:#22c07d;border-color:rgba(34,192,125,.3)}
.cact.wa:hover{background:#22c07d;color:#fff}
.avatar{width:23px;height:23px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--purple));display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff}
.card .cdate{font-size:10.5px;color:var(--muted2);margin-inline-start:auto}
.card .cmove{margin-inline-start:8px;width:26px;height:26px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--brand-2);cursor:pointer;flex-shrink:0}
.card .cmove:hover{background:var(--brand);color:#fff}
.board-search{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:var(--txt);padding:10px 14px;font-size:13.5px;outline:none}
.board-search:focus{border-color:var(--brand)}
.sim-row{margin-bottom:16px}
.sim-row label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.sim-row label b{color:var(--brand-2);font-size:14px}
.sim-row input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:7px;border-radius:5px;background:var(--line2);outline:none}
.sim-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 2px 8px rgba(47,111,237,.5);border:3px solid var(--surface)}
.sim-row input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--brand);cursor:pointer;border:3px solid var(--surface)}
.gantt{overflow-x:auto;padding-bottom:6px}
.gantt-grid{min-width:620px}
.gantt-head{display:flex;margin-bottom:10px}
.gantt-side{width:170px;flex-shrink:0}
.gantt-months{flex:1;display:flex}
.gantt-months span{flex:1;text-align:center;font-size:11px;color:var(--muted2);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.gantt-row{display:flex;align-items:center;margin-bottom:8px}
.gantt-label{width:170px;flex-shrink:0;font-size:12.5px;padding-inline-end:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.gantt-track{flex:1;position:relative;height:28px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gantt-bar{position:absolute;top:3px;bottom:3px;border-radius:6px;font-size:10.5px;font-weight:800;color:#08101f;display:flex;align-items:center;padding:0 8px;cursor:pointer;overflow:hidden;white-space:nowrap;transition:.15s}
.gantt-bar:hover{filter:brightness(1.15);transform:translateY(-1px)}
@media(max-width:820px){.gantt-label{width:110px;font-size:11.5px}.gantt-grid{min-width:520px}}
.gb-resize{position:absolute;inset-inline-end:0;top:0;bottom:0;width:10px;cursor:ew-resize;background:rgba(0,0,0,.18);border-start-end-radius:6px;border-end-end-radius:6px}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.pk-col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:90px;transition:.15s}
.pk-col.dragover{border-color:var(--brand);background:rgba(47,111,237,.08)}
.pk-head{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);margin-bottom:9px;text-transform:uppercase}
.pk-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;margin-bottom:7px;cursor:grab}
.pk-item:hover{border-color:var(--brand)}
@media(max-width:820px){.pk{grid-template-columns:1fr}}
.blk{display:flex;align-items:flex-start;gap:6px;padding:3px 0;border-radius:8px}
.blk:hover{background:rgba(47,111,237,.05)}
.blk-grip{color:var(--muted2);cursor:grab;font-size:13px;padding:3px 4px;opacity:0;flex-shrink:0;user-select:none}
.blk:hover .blk-grip{opacity:.8}
.blk-tools{display:flex;gap:2px;opacity:0;flex-shrink:0}
.blk:hover .blk-tools{opacity:1}
.blk-tools span{cursor:pointer;color:var(--muted2);font-size:11px;padding:3px 5px;border-radius:6px}
.blk-tools span:hover{background:var(--surface);color:var(--txt)}
.blk-h{font-size:17.5px;font-weight:800;padding:5px 4px;outline:none;border-radius:6px}
.blk-p{font-size:13.8px;line-height:1.65;padding:4px;outline:none;border-radius:6px;min-height:22px;white-space:pre-wrap}
.blk-h:focus,.blk-p:focus{background:var(--bg);box-shadow:0 0 0 1px var(--brand)}
@media(max-width:820px){.blk-grip,.blk-tools{opacity:.6}}
.canvas-wrap{position:relative;height:62vh;min-height:380px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);background-size:26px 26px}
.cv-inner{position:relative;width:2400px;height:1400px}
#cvSvg{position:absolute;inset:0;pointer-events:none}
#cvSvg g{pointer-events:auto}
.cv-node{position:absolute;width:200px;background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 28px -14px rgba(0,0,0,.7);user-select:none;z-index:2}
.cv-node.linking{box-shadow:0 0 0 2px var(--brand),0 10px 28px -14px rgba(0,0,0,.7)}
.cvn-head{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:grab;border-bottom:1px solid var(--line)}
.cvn-head:active{cursor:grabbing}
.cvn-tools{margin-inline-start:auto;display:flex;gap:2px;opacity:0;transition:.14s}
.cv-node:hover .cvn-tools{opacity:1}
.cvn-tools span{cursor:pointer;font-size:11px;padding:2px 4px;border-radius:6px}
.cvn-tools span:hover{background:var(--bg)}
.cvn-body{padding:9px 11px;font-size:12.8px;line-height:1.5;min-height:34px;outline:none;cursor:text;white-space:pre-wrap;word-break:break-word}
.cvn-body:focus{background:var(--bg);border-radius:0 0 11px 11px}
@media(max-width:820px){.cvn-tools{opacity:.75}.canvas-wrap{height:55vh}}
.cal{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2)}
.cal-dows span{padding:9px 6px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted2);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-top:1px solid var(--line);border-inline-start:1px solid var(--line);padding:5px;position:relative;transition:.12s}
.cal-cell:nth-child(7n+1){border-inline-start:none}
.cal-cell.empty{background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(127,127,127,.04) 6px,rgba(127,127,127,.04) 12px)}
.cal-cell.today{background:rgba(47,111,237,.09)}
.cal-cell.over{background:rgba(47,111,237,.18);box-shadow:inset 0 0 0 2px var(--brand)}
.cal-daynum{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cal-cell.today .cal-daynum{color:var(--brand-2)}
.cal-add{margin-inline-start:auto;width:18px;height:18px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted2);font-size:13px;line-height:16px;text-align:center;cursor:pointer;opacity:0;transition:.12s}
.cal-cell:hover .cal-add{opacity:1}
.cal-add:hover{background:var(--brand);color:#fff}

/* ============================================================
   LEDGER — systeme de design v5.38
   Papier blanc · filets · angles nets · bleu de marque en accent
   ============================================================ */
body{background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
::selection{background:rgba(47,111,237,.16);color:var(--txt)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3.5px solid var(--bg);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted2);border:3.5px solid var(--bg);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.stat .val,.tbl,.nav-item .badge{font-variant-numeric:tabular-nums}

/* --- Structure --- */
.app{grid-template-columns:238px 1fr}
[dir="rtl"] .app{grid-template-columns:1fr 238px}
.side{background:var(--bg2);border-inline-end:1px solid var(--line);padding:20px 12px 16px}
.brand{padding:2px 8px 20px}
.me{background:transparent;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
.me:hover{border-color:var(--line2);background:var(--surface)}
.me .av{border-radius:2px;background:var(--txt);font-size:11px}
.me .mn{font-weight:600}
.nav-label{font-size:9.5px;letter-spacing:.14em;font-weight:700;color:var(--muted2);padding:20px 10px 7px}
.nav-item{border-radius:var(--r-sm);padding:7px 10px;border:none;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.nav-item:hover{background:var(--surface2);color:var(--txt)}
.nav-item.active{background:var(--surface2);color:var(--txt);font-weight:650;border:none}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:6px;bottom:6px;width:2px;background:var(--brand);border-radius:2px}
.nav-item .badge{background:transparent;border:none;padding:0;color:var(--muted2);font-weight:600;font-size:11px;border-radius:2px}
.badge,.ccount,.st-pill{border-radius:2px}
.st-pill{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:3px 7px}
.add-card{border-radius:4px;border-style:dashed;border-color:var(--line2)}
.lb-av{border-radius:3px;background:var(--txt)}
.chat-msg.mine .chat-bub{background:var(--brand);border-radius:4px}
.chat-bub{border-radius:4px}
.nav-item.active .badge{background:transparent;color:var(--brand-2)}
.nav-item .badge.red{background:transparent;color:var(--bad);font-weight:700}
.mini-btn{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line)}
.mini-btn:hover{background:var(--surface);border-color:var(--line2)}
.kbd{border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.langs .lg{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line)}
.langs .lg.on{background:var(--txt);color:#fff;border-color:var(--txt)}

/* --- En-tete --- */
.topbar{padding:19px 34px;background:var(--bg);gap:12px}
.topbar h1{font-size:23px;font-weight:680;letter-spacing:-.025em}
.topbar .sub{color:var(--muted2);font-size:12px;margin-top:3px}
.iconbtn{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line);width:34px;height:34px;font-size:14px}
.iconbtn:hover{background:var(--surface2);border-color:var(--line2)}
.cmdk{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line);padding:8px 12px;font-size:12.5px}
.cmdk:hover{border-color:var(--line2);background:var(--surface2);color:var(--muted)}
.toggle-mine{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line);padding:7px 12px}
.toggle-mine.on{background:var(--brand-wash);border-color:var(--brand);color:var(--brand-2)}
.content{padding:26px 34px 72px}
.fade{animation:fade .28s cubic-bezier(.2,.7,.3,1)}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* --- Boutons --- */
.btn{border-radius:var(--r-sm);box-shadow:none;font-weight:600;font-size:12.5px;padding:9px 15px;letter-spacing:0}
.btn:hover{transform:none;background:var(--brand-dark)}
.btn.ghost{background:var(--surface);color:var(--txt);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--muted2)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.danger{border-radius:var(--r-sm);border-color:var(--line2)}

/* --- Blocs de contenu : filets, pas d'ombres --- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:none;margin-bottom:16px}
.panel h3{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.panel h3 .dot{width:3px;height:11px;border-radius:1px;background:var(--brand)}
.panel h3 .tag{background:var(--brand-wash);color:var(--brand-2);border-radius:2px;font-size:9.5px;letter-spacing:.08em;padding:3px 7px}
.panel h3 .act{color:var(--brand-2);font-size:10.5px;letter-spacing:.06em}
.row2{gap:16px;margin-bottom:16px}

/* --- Chiffres : la hierarchie porte le design --- */
.stat-grid{gap:16px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stat .lbl{font-size:9.5px;letter-spacing:.14em;color:var(--muted2);font-weight:700}
.stat .val{font-size:31px;font-weight:680;letter-spacing:-.035em;margin-top:9px;line-height:1.05}
.stat .val small{font-size:13px;color:var(--muted2);letter-spacing:0}
.stat .chg{font-size:11.5px;margin-top:6px;color:var(--muted2)}
.stat .ic{background:transparent;border-radius:0;color:var(--muted2);width:auto;height:auto;inset-inline-end:18px;top:17px;opacity:.5}
.stat .ic svg{width:15px;height:15px}

/* --- Cartes --- */
.grid-cards{gap:16px}
.hcard,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.hcard{padding:18px 20px}
.hcard:hover,.card:hover{transform:none;border-color:var(--muted2)}
.hcard .hname{font-weight:640;font-size:14px;letter-spacing:-.01em}
.hcard .hrow{font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.hcard .hrow:last-of-type{border-bottom:none}
.hcard .hh{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card{border-radius:4px;padding:13px 14px}
.card .ctitle{font-weight:640;font-size:13.5px;letter-spacing:-.01em}
.card .cmove{border-radius:3px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.card .cmove:hover{background:var(--txt);color:#fff;border-color:var(--txt)}
.avatar{border-radius:2px;background:var(--txt);font-weight:700}
.card.rot::after{box-shadow:none;border-radius:1px;width:6px;height:6px}

/* --- Etiquettes : carrees, typographiques, jamais pastel-bonbon --- */
.chip{border-radius:2px;background:var(--surface2);border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--muted);padding:2px 7px}
.chip.money{color:var(--good);background:transparent;border-color:var(--line)}
.pill{border-radius:2px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:3px 7px}
.pill.good{background:transparent;color:var(--good);box-shadow:inset 0 0 0 1px currentColor}
.pill.warn{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}
.pill.bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px currentColor}
.cact{border-radius:3px;font-weight:650;letter-spacing:0;border:1px solid var(--line)}
.cact.call{background:transparent;color:var(--brand-2);border-color:var(--line2)}
.cact.call:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.cact.wa{background:transparent;color:var(--good);border-color:var(--line2)}
.cact.wa:hover{background:var(--good);color:#fff;border-color:var(--good)}

/* --- Tableaux : le coeur du style registre --- */
.tbl{font-size:12.5px}
.tbl th{font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--muted2);padding:0 12px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line)}
.tbl tr:hover{background:var(--surface2)}

/* --- Colonnes / kanban --- */
.board{gap:16px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r)}
.col-head{padding:13px 14px}
.col-head .cdot{width:7px;height:7px;border-radius:1px}
.col-head .cname{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.col-head .ccount{background:transparent;border:none;color:var(--muted2);padding:0;font-size:11px;border-radius:2px}
.col-body.dragover{background:var(--brand-wash);outline:1px dashed var(--brand);border-radius:4px}
.pk-col{border-radius:4px;background:var(--bg2)}
.pk-col.dragover{background:var(--brand-wash)}
.pk-item{border-radius:3px}
.pk-head{font-size:10px;letter-spacing:.12em}

/* --- Graphiques : aplats, zero degrade --- */
.fbar .ftrack{background:var(--surface2);border-radius:2px;height:26px}
.fbar .ffill{background:var(--brand);border-radius:2px;font-weight:650;font-size:11.5px}
.fbar .flabel{font-size:11.5px;color:var(--muted)}
.cbar{background:var(--brand);border-radius:2px 2px 0 0}
.cbar .cbv{font-size:10px;color:var(--muted2);font-weight:650}
.gantt-track{background:var(--surface2);border-radius:2px;border-color:var(--line)}
.gantt-bar{border-radius:2px;font-weight:700;color:#fff}
.gantt-bar:hover{filter:brightness(1.06);transform:none}
.gantt-months span{font-size:9.5px;letter-spacing:.12em;color:var(--muted2)}
.gantt-label{font-size:12px;color:var(--muted)}
.gb-resize{background:rgba(255,255,255,.25);border-radius:0 2px 2px 0}
.ring .rt b{font-size:19px;font-weight:680;letter-spacing:-.02em}

/* --- Formulaires --- */
.field label{font-size:10px;letter-spacing:.1em;color:var(--muted2);font-weight:700;margin-bottom:7px}
.field input,.field select,.field textarea{border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line2);font-size:13.5px;padding:10px 12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.11)}
.board-search{border-radius:var(--r-sm);border-color:var(--line2);font-size:13px}
.board-search:focus{box-shadow:0 0 0 3px rgba(47,111,237,.11)}
input[type=range]{height:4px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{width:16px;height:16px;border-radius:50%;background:var(--brand);box-shadow:none;border:2px solid var(--surface)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--brand);border:2px solid var(--surface)}

/* --- Fenetres modales --- */
.overlay{background:rgba(12,14,20,.32);backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:6px;box-shadow:0 24px 60px -24px rgba(10,12,20,.3)}
.modal-head{padding:19px 24px}
.modal-head h3{font-size:15px;font-weight:660;letter-spacing:-.015em}
.modal-head .x{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line);width:29px;height:29px}
.modal-head .x:hover{background:var(--surface2)}
.modal-foot{padding:15px 24px}

/* --- Divers --- */
.toast{border-radius:var(--r-sm);background:var(--txt);color:#fff;border:none;border-inline-start:2px solid var(--good);box-shadow:0 12px 30px -12px rgba(0,0,0,.45);font-weight:550;font-size:12.5px}
.empty{color:var(--muted2);font-size:13px;letter-spacing:-.005em}
.nba-item{border-radius:4px;background:var(--surface);border-color:var(--line)}
.nba-item:hover{border-color:var(--muted2)}
.nba-rank{border-radius:2px;font-size:11px}
.nba-txt{font-weight:600}
.blk-h{font-size:17px;font-weight:680;letter-spacing:-.02em}
.blk:hover{background:var(--surface2)}
.blk-h:focus,.blk-p:focus{background:var(--surface2);box-shadow:inset 2px 0 0 var(--brand)}
.canvas-wrap{border-radius:var(--r);background:var(--bg2)}
.cv-node{border-radius:4px;background:var(--surface);box-shadow:0 2px 8px -4px rgba(10,12,20,.18)}
.cv-node.linking{box-shadow:0 0 0 2px var(--brand)}
.cal{border-radius:var(--r)}
.cal-dows{background:var(--bg2)}
.cal-dows span{font-size:9.5px;letter-spacing:.12em}
.cal-cell.today{background:var(--brand-wash)}
.goal-edit{color:var(--brand-2);font-size:10.5px;letter-spacing:.04em}
@media(max-width:820px){.topbar{padding:15px 18px}.content{padding:20px 18px 64px}.panel{padding:18px 16px}}

/* --- Ecran de connexion : la premiere impression --- */
.login-ov{background:var(--bg);background-image:none;gap:0;padding:24px}
.login-ov img{max-width:220px;max-height:62px;margin-bottom:26px}
.login-ov h2{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--muted);margin-bottom:22px}
.login-users{gap:12px}
.luser{border-radius:4px;padding:18px 16px;min-width:124px;background:var(--surface);border:1px solid var(--line)}
.luser:hover{transform:none;border-color:var(--txt)}
.luser .lav{border-radius:3px;background:var(--txt);width:38px;height:38px;font-size:14px}
.luser .ln{font-weight:620;font-size:13px;letter-spacing:-.01em}
.luser .lr{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);font-weight:600}
.luser.add{border-style:dashed;border-color:var(--line2)}
.login-langs{margin-top:26px}
.login-langs .lg{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line);font-weight:600;font-size:12px;padding:7px 14px}
.login-langs .lg.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.login-pass{border-radius:6px;padding:30px 32px;box-shadow:0 20px 50px -26px rgba(10,12,20,.28);border-color:var(--line2)}
.login-pass .lp-name{font-weight:640;font-size:15px;letter-spacing:-.015em}
.login-pass input{border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line2);font-size:14px}
.lp-inwrap{position:relative;width:100%}
.lp-inwrap input{width:100%;padding-inline-end:40px!important}
.lp-eye{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:.45;font-size:15px;user-select:none}
.lp-eye:hover{opacity:.9}
.lp-caps{font-size:11.5px;color:var(--warn);font-weight:600;text-align:center;line-height:1.5}
.lp-hint{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.65;max-width:300px}
.login-pass input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.11)}

/* --- Palette de commandes --- */
.cmd-box{background:var(--surface);border:1px solid var(--line2);border-radius:6px;box-shadow:0 24px 60px -24px rgba(10,12,20,.3)}
.cmd-box input{font-size:15px;padding:16px 18px}
.hamburger{border-radius:var(--r-sm);background:transparent;border:1px solid var(--line)}

/* --- Visite guidee --- */
.tour-card{background:var(--surface);border:1px solid var(--line2);border-radius:6px;box-shadow:0 24px 60px -24px rgba(10,12,20,.3);padding:32px}
.tour-card h3{font-size:18px;font-weight:660;letter-spacing:-.02em}
.tour-card p{font-size:13.5px;color:var(--muted)}

/* --- Lecteur de script / document --- */
.tplreader .docsheet{width:100%;margin:0 0 14px 0;padding:26px 28px;min-height:0;box-shadow:none;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--txt);font-family:inherit;font-size:14.5px;line-height:1.85}
.tplreader .docsheet:last-child{margin-bottom:0}
.tplreader .docxbody{font-family:inherit;font-size:14.5px;line-height:1.8;color:var(--txt)}
.tplreader .docxbody h1,.tplreader .docxbody h2,.tplreader .docxbody h3{font-weight:660;letter-spacing:-.015em;margin:18px 0 8px}
.tplreader .docxbody table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 12px}
.tplreader .docxbody td,.tplreader .docxbody th{border:1px solid var(--line);padding:7px 10px;text-align:start}
.filerow{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:7px;font-size:12.5px}
.filerow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* --- Selection multiple --- */
.card{position:relative}
.selbox{position:absolute;top:9px;inset-inline-end:9px;width:17px;height:17px;border:1.5px solid var(--line2);border-radius:3px;background:var(--surface);cursor:pointer;z-index:3;opacity:0;transition:.12s;flex-shrink:0}
.card:hover .selbox,.selbox.on{opacity:1}
.selbox.on{background:var(--brand);border-color:var(--brand)}
.selbox.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;line-height:1}
.selbox.tbl-box{position:static;display:inline-block;opacity:1;vertical-align:middle}
.card.selected,tr.selected{box-shadow:inset 0 0 0 1.5px var(--brand)}
tr.selected{background:var(--brand-wash)}
.selall{cursor:pointer;font-size:12px;color:var(--muted2);padding:0 4px;user-select:none}
.selall:hover{color:var(--brand)}
.selbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;background:var(--txt);color:#fff;border-radius:5px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 18px 44px -16px rgba(10,12,20,.5);font-size:12.5px;max-width:calc(100vw - 32px)}
.selbar b{font-weight:650;white-space:nowrap}
.selbar select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:3px;padding:6px 9px;font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.selbar select option{background:#fff;color:var(--txt)}
.selbar .btn{padding:6px 11px;font-size:12px}
.selbar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.selbar .btn.ghost:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45)}
.selbar-x{cursor:pointer;opacity:.6;padding:0 4px;font-size:14px}
.selbar-x:hover{opacity:1}
@media(max-width:820px){.selbar{bottom:12px;gap:7px;padding:9px 11px}.selbox{opacity:1}}

/* --- Corrections mode sombre (les aplats noirs s'inversent) --- */
html[data-theme="dark"] .toast{background:var(--surface2);color:var(--txt);border:1px solid var(--line2);border-inline-start:2px solid var(--good)}
html[data-theme="dark"] .avatar,html[data-theme="dark"] .me .av,html[data-theme="dark"] .luser .lav,html[data-theme="dark"] .lb-av{background:var(--brand);color:#fff}
html[data-theme="dark"] .login-langs .lg.on{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-theme="dark"] .langs .lg.on{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-theme="dark"] .card .cmove:hover{background:var(--brand);border-color:var(--brand)}
html[data-theme="dark"] .side{background:var(--bg2)}
html[data-theme="dark"] .gantt-bar{color:#08101f}
</style>
</head>
<body>
<div class="login-ov" id="loginOv">
  <img src="logo.png" alt="DevelopTheOne">
  <div class="login-langs" id="loginLangs"></div>
  <h2 id="loginTitle">Qui etes-vous ?</h2>
  <div class="login-users" id="loginUsers"></div>
  <div class="login-pass" id="loginPass" style="display:none">
    <div class="lp-name">&#128274; <span id="loginPassName"></span></div>
    <div class="lp-inwrap"><input type="password" id="loginPassInput" placeholder="Mot de passe" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="loginPassKey(event)" oninput="document.getElementById('loginPassErr').style.display='none'"><span class="lp-eye" id="lpEye" onclick="toggleLoginPassVisible()" title="Afficher / masquer">&#128065;</span></div>
    <div class="lp-caps" id="loginCaps" style="display:none">&#9888; La touche Maj (Caps Lock) est activee</div>
    <div class="lp-err" id="loginPassErr">Mot de passe incorrect</div>
    <div class="lp-hint" id="loginPassHint" style="display:none"></div>
    <div class="lp-actions"><button class="btn ghost" onclick="cancelLoginPass()">Annuler</button><button class="btn" onclick="confirmLoginPass()">Entrer</button></div>
  </div>
</div>
<div class="tour-ov" id="tourOv"><div class="tour-card">
  <div class="temoji" id="tourEmoji">&#128075;</div>
  <h3 id="tourTitle"></h3><p id="tourText"></p>
  <div class="tour-dots" id="tourDots"></div>
  <div class="tour-foot"><button class="btn ghost" onclick="tourEnd()" id="tourSkip">Passer</button><button class="btn" onclick="tourNext()" id="tourNext">Suivant</button></div>
</div></div>
<div class="side-backdrop" id="sideBackdrop" onclick="closeSidebar()"></div>
<div class="app">
  <aside class="side" id="sideNav">
    <div class="brand"><img src="logo.png" alt="DevelopTheOne"></div>
    <div class="me" id="meBox" onclick="showLogin()"><div class="av" id="meAv">?</div><div><div class="mn" id="meName">-</div><div class="mr" id="meRole"></div></div><span class="sw" id="meSwitch"></span></div>

function avgHourly(){var tm=(DB._team||[]).filter(function(m){return +m.costMonth>0;});if(!tm.length)return 0;var h=+finCfg().hoursMonth||160;return tm.reduce(function(a,m){return a+(+m.costMonth/h);},0)/tm.length;}
function intelClients(){var s={};["sales","success","fulfilment","onboarding","invoices"].forEach(function(k){(DB[k]||[]).forEach(function(r){var n=r.client||r.name;if(n)s[n]=1;});});(DB.plans||[]).forEach(function(p){if(p.client)s[p.client]=1;});return Object.keys(s).sort();}
function clientRevenue(n){var paid=(DB.invoices||[]).filter(function(i){return i.client===n&&i.status==="Paye";}).reduce(function(a,i){return a+(+i.amount||0);},0);
 var signed=(DB.sales||[]).filter(function(s){return s.client===n&&s.stage==="Signe";}).reduce(function(a,s){return a+(+s.value||0);},0);
 var mrr=(DB.success||[]).filter(function(s){return s.name===n;}).reduce(function(a,s){return a+(+s.mrr||0);},0);
 return {paid:paid,signed:signed,mrr:mrr,total:paid>0?paid:signed};}
function clientCost(n){var logs=(DB._time||[]).filter(function(x){return x.client===n;});
 var hours=logs.reduce(function(a,x){return a+(+x.hours||0);},0);
 var labour=logs.reduce(function(a,x){var r=memberHourly(x.who)||avgHourly();return a+(+x.hours||0)*r;},0);
 var ads=(DB.plans||[]).filter(function(p){return p.client===n;}).reduce(function(a,p){return a+(p.items||[]).reduce(function(x,i){return x+(+i.budget||0);},0);},0);
 return {hours:hours,labour:Math.round(labour),ads:ads,total:Math.round(labour)+ads};}

var STAGE_P={"RDV programme":.15,"Proposition envoyee":.35,"Negociation":.6};
function histWinRate(){var s=DB.sales||[];var w=s.filter(function(x){return x.stage==="Signe";}).length,l=s.filter(function(x){return x.stage==="Perdu";}).length;return (w+l)>=5?w/(w+l):null;}
function avgCycleDays(){var won=(DB.sales||[]).filter(function(s){return s.stage==="Signe"&&s.createdAt;});if(!won.length)return 30;var c=won.map(function(s){return Math.max(1,daysBetween(s.createdAt,s.updatedAt||today()));});return Math.round(c.reduce(function(a,b){return a+b;},0)/c.length);}
function dealProb(s,cal,cyc){var base=STAGE_P[s.stage]!=null?STAGE_P[s.stage]:.2;var p=base*cal;
 var age=s.createdAt?daysBetween(s.createdAt,today()):0;
 if(cyc>0&&age>cyc*1.5)p*=Math.max(.25,1-((age-cyc*1.5)/(cyc*3)));
 return Math.max(.02,Math.min(.95,p));}
function forecastModel(){
 var open=(DB.sales||[]).filter(function(s){return ["Signe","Perdu"].indexOf(s.stage)<0&&(+s.value||0)>0;});
 var hw=histWinRate(),cyc=avgCycleDays();
 var baseAvg=open.length?open.reduce(function(a,s){return a+(STAGE_P[s.stage]!=null?STAGE_P[s.stage]:.2);},0)/open.length:.25;
 var cal=(hw!=null&&baseAvg>0)?Math.max(.35,Math.min(2.2,hw/baseAvg)):1;
 var deals=open.map(function(s){return {name:s.client||"?",v:+s.value||0,p:dealProb(s,cal,cyc),stage:s.stage,age:s.createdAt?daysBetween(s.createdAt,today()):0};});
 return {deals:deals,cal:cal,hw:hw,cyc:cyc};}
function runMonteCarlo(deals,n){n=n||10000;var out=new Array(n);
 for(var i=0;i<n;i++){var s=0;for(var j=0;j<deals.length;j++){if(Math.random()<deals[j].p)s+=deals[j].v;}out[i]=s;}
 out.sort(function(a,b){return a-b;});return out;}
function pctl(sorted,q){if(!sorted.length)return 0;var i=Math.min(sorted.length-1,Math.max(0,Math.round((sorted.length-1)*q)));return sorted[i];}

 var p10=pctl(sims,.1),p50=pctl(sims,.5),p90=pctl(sims,.9);

 +kpiTile("OPTIMISTE (P90)",money(p90),"1 chance sur 10 de depasser","var(--good)")

 +'</div>';
 if(hitProb!=null)h+='<div style="margin-top:14px;padding:13px 15px;border-radius:4px;background:'+(hitProb>=60?"rgba(34,192,125,.12)":hitProb>=30?"rgba(245,185,64,.12)":"rgba(244,104,95,.12)")+';border:1px solid var(--line)"><b style="font-size:14px">🎯 Probabilite d\'atteindre l\'objectif ('+money(goal)+') : <span style="color:'+(hitProb>=60?"var(--good)":hitProb>=30?"var(--warn,#f5b940)":"var(--bad)")+'">'+hitProb+'%</span></b>'+(hitProb<50?'<div style="font-size:12.5px;color:var(--muted);margin-top:6px">Il manque environ '+money(Math.max(0,goal-p50))+' au scenario median. Ajoutez du pipeline ou faites avancer les affaires en Negociation.</div>':'')+'</div>';
 h+='</div>';
 // Histogramme
 var lo=sims[0],hi=sims[sims.length-1],B=18,buckets=new Array(B);for(var b=0;b<B;b++)buckets[b]=0;
 var span=Math.max(1,hi-lo);
 sims.forEach(function(v){var idx=Math.min(B-1,Math.floor((v-lo)/span*B));buckets[idx]++;});
 var maxB=Math.max.apply(null,buckets);
 h+='<div class="panel"><h3><span class="dot"></span>📊 Distribution des resultats possibles</h3><div style="display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:10px">'
 +buckets.map(function(cnt,i){var v=lo+span*(i+.5)/B;var col=v<p10?"var(--bad)":v>p90?"var(--good)":"var(--brand)";

function lastTouchDays(n){var ds=[];
 (DB._touches||[]).forEach(function(t){if((t.client||t.name)===n&&t.ts)ds.push(t.ts.slice(0,10));});
 (DB.success||[]).forEach(function(s){if(s.name===n&&s.lastCheckin)ds.push(s.lastCheckin);});
 (DB._log||[]).forEach(function(l){if(l.detail&&l.detail.indexOf(n)>=0&&l.ts)ds.push(l.ts.slice(0,10));});
 if(!ds.length)return null;ds.sort();return daysBetween(ds[ds.length-1],today());}
function healthScore(n){var f=[],risk=0;
 var ov=(DB.invoices||[]).filter(function(i){return i.client===n&&i.status!=="Paye"&&i.dueDate&&i.dueDate<today();});
 if(ov.length){var worst=Math.max.apply(null,ov.map(function(i){return daysBetween(i.dueDate,today());}));
  var pts=Math.min(30,Math.round(worst/2));risk+=pts;f.push({p:pts,txt:"Facture impayee depuis "+worst+" jours ("+money(ov.reduce(function(a,i){return a+(+i.amount||0);},0))+")"});}
 var lt=lastTouchDays(n);
 if(lt!=null&&lt>14){var p2=Math.min(25,Math.round((lt-14)/2));risk+=p2;f.push({p:p2,txt:"Aucun contact depuis "+lt+" jours"});}
 else if(lt==null){risk+=12;f.push({p:12,txt:"Aucune trace de contact enregistree"});}
 var sc=(DB.success||[]).find(function(s){return s.name===n;});
 if(sc){if(sc.health==="Churne"){risk+=40;f.push({p:40,txt:"Marque comme churne"});}
  else if(sc.health==="A risque"){risk+=22;f.push({p:22,txt:"Marque a risque"});}}
 var late=(DB.fulfilment||[]).filter(function(x){return x.client===n&&x.status!=="Livre"&&x.deadline&&x.deadline<today();});
 if(late.length){var p3=Math.min(20,late.length*8);risk+=p3;f.push({p:p3,txt:late.length+" livrable(s) en retard de votre cote"});}
 var recentPosts=(DB.content||[]).filter(function(p){return p.client===n&&p.date>=today();}).length;
 var openPlans=(DB.plans||[]).filter(function(p){return p.client===n;}).length;
 if(!recentPosts&&!openPlans&&sc){risk+=8;f.push({p:8,txt:"Aucun travail planifie a venir"});}
 f.sort(function(a,b){return b.p-a.p;});
 return {risk:Math.min(100,risk),factors:f,mrr:(sc&&+sc.mrr)||0,health:sc?sc.health:null};}
function savePlay(n,h){
 if(!h.factors.length)return "Rien a signaler. Maintenez le rythme de contact.";

 if(/Facture impayee/.test(top))return "Appelez aujourd'hui pour debloquer le paiement — proposez un echeancier plutot que de laisser pourrir. Ne lancez pas de nouveau travail avant regularisation.";
 if(/Aucun contact|Aucune trace/.test(top))return "Envoyez un point de valeur (pas une relance commerciale) : resultats du mois, une idee concrete. Puis proposez un appel de 15 min.";
 if(/churne/.test(top))return "Appel de sortie : comprenez la vraie raison. Proposez une offre de reconquete a perimetre reduit. Demandez une recommandation meme s'il part.";
 if(/a risque/.test(top))return "Bloquez 30 min cette semaine : montrez les resultats obtenus, ecoutez les frustrations, re-engagez sur un objectif a 30 jours.";
 if(/retard de votre cote/.test(top))return "Rattrapez le retard AVANT qu'il ne le signale. Prevenez proactivement avec une nouvelle date ferme — c'est ce qui sauve la relation.";

var _cashWhat={hire:0,priceUp:0,churn:0};
function cashModel(){
 var f=finCfg();
 var mrr=(DB.success||[]).filter(function(s){return s.health!=="Churne";}).reduce(function(a,s){return a+(+s.mrr||0);},0);
 mrr=mrr*(1-(_cashWhat.churn||0)/100)*(1+(_cashWhat.priceUp||0)/100);
 var out=teamCostMonth()+(+f.fixedCosts||0)+(_cashWhat.hire||0);
 var m=forecastModel();
 var pipeline=m.deals.reduce(function(a,d){return a+d.v*d.p;},0)*(1+(_cashWhat.priceUp||0)/100);
 var cyc=Math.max(1,Math.round(m.cyc/30))||1;
 var months=[],cash=+f.cash||0;var now=new Date();
 for(var i=0;i<12;i++){
  var d=new Date(now.getFullYear(),now.getMonth()+i,1);
  var lbl=d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
  var invIn=(DB.invoices||[]).filter(function(x){return x.status!=="Paye"&&x.dueDate&&x.dueDate.slice(0,7)===d.toISOString().slice(0,7);}).reduce(function(a,x){return a+(+x.amount||0);},0);
  var pipeIn=(i>=cyc&&i<cyc+3)?pipeline/3:0;
  var inflow=mrr+invIn+pipeIn;
  cash+=inflow-out;
  months.push({lbl:lbl,inflow:Math.round(inflow),outflow:Math.round(out),net:Math.round(inflow-out),cash:Math.round(cash),mrr:Math.round(mrr),inv:invIn,pipe:Math.round(pipeIn)});
 }
 var runway=null;for(var j=0;j<months.length;j++){if(months[j].cash<0){runway=j;break;}}
 return {months:months,mrr:Math.round(mrr),out:Math.round(out),runway:runway,start:+f.cash||0,pipeline:Math.round(pipeline)};}

var LOAD_H={task:1.5,fulfil:8,plan:6,post:1};
function weekStart(d){var x=new Date(d);var day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function capacityModel(){
 var f=finCfg();var perWeek=Math.round((+f.hoursMonth||160)/4.33);
 var members=(DB._team||[]).map(function(m){return m.name;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;});
 var w0=weekStart(new Date());var weeks=[];
 for(var i=0;i<8;i++){var ws=new Date(w0);ws.setDate(ws.getDate()+i*7);var we=new Date(ws);we.setDate(we.getDate()+6);
  weeks.push({s:ws.toISOString().slice(0,10),e:we.toISOString().slice(0,10),lbl:ws.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})});}
 var grid={};members.forEach(function(n){grid[n]=weeks.map(function(){return {h:0,items:[]};});});
 function put(who,date,hrs,label){if(!who||!date)return;if(!grid[who])return;
  for(var i=0;i<weeks.length;i++){if(date>=weeks[i].s&&date<=weeks[i].e){grid[who][i].h+=hrs;grid[who][i].items.push(label);return;}}}
 (DB.tasks||[]).forEach(function(t){if(t.done!=="Oui")put(t.assignee,t.due,LOAD_H.task,t.title);});
 (DB.fulfilment||[]).forEach(function(x){if(x.status!=="Livre")put(x.owner,x.deadline,LOAD_H.fulfil,(x.client||"")+" — "+(x.service||""));});
 (DB.content||[]).forEach(function(p){if(p.status!=="Publie")put(p.owner,p.date,LOAD_H.post,(p.channel||"")+" "+(p.title||""));});
 (DB.plans||[]).forEach(function(p){(p.items||[]).forEach(function(it){if((it.status||"")==="Termine"||!it.owner)return;
   var parts=(p.start||today().slice(0,7)).split("-");var d=new Date(+parts[0],(+parts[1]||1)-1+(+it.month||0),15);
   put(it.owner,d.toISOString().slice(0,10),LOAD_H.plan,(p.title||"")+" — "+(it.title||""));});});
 return {weeks:weeks,grid:grid,members:members,perWeek:perWeek};}

 el.innerHTML='<div style="padding:13px 15px;border-radius:4px;background:'+(!ok?"rgba(244,104,95,.12)":solo.length?"rgba(34,192,125,.12)":"rgba(245,185,64,.12)")+';border:1px solid var(--line);font-size:13px;line-height:1.7"><b style="color:'+(!ok?"var(--bad)":solo.length?"var(--good)":"var(--warn,#f5b940)")+'">'+verdict+'</b><br>'

var _openList=null;

 st.worked=st.total-st.nouveau;
 st.progress=st.total?Math.round(st.worked/st.total*100):0;

 st.rdvRate=st.worked?Math.round((st.rdv+st.gagne)/st.worked*100):0;

 st.owners=Object.keys(owners).map(function(k){return {n:k,c:owners[k]};}).sort(function(a,b){return b.c-a.c;});
 return st;}
